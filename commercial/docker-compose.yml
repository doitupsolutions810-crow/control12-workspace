services:
  control12-commercial:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONTROL12_DATA_DIR: /app/data
      CONTROL12_ADMIN_KEY: ${CONTROL12_ADMIN_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - control12_commercial_data:/app/data
    restart: unless-stopped
volumes:
  control12_commercial_data:
