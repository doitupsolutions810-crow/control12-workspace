name: CONTROL12 boundary regression
on:
  push:
    branches: [main, "integration/control12-*"]
    paths:
      - "integrations/control12_gateway.py"
      - "tests/test_control12_gateway_contract.py"
      - "tests/test_control12_v0264_bridge_regression.py"
      - ".github/workflows/control12-boundary.yml"
  pull_request:
    paths:
      - "integrations/control12_gateway.py"
      - "tests/test_control12_gateway_contract.py"
      - "tests/test_control12_v0264_bridge_regression.py"
      - ".github/workflows/control12-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test requirements
        run: python -m pip install "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Validate syntax and signed adapter edge tests
        run: |
          python -m compileall -q integrations/control12_gateway.py tests/test_control12_gateway_contract.py tests/test_control12_v0264_bridge_regression.py
          python -m pytest -q tests/test_control12_gateway_contract.py tests/test_control12_v0264_bridge_regression.py --junitxml=control12-test-results.xml
      - name: Save reproducible CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control12-boundary-${{ matrix.python-version }}
          path: control12-test-results.xml
          if-no-files-found: ignore
